<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MatchPet - Cadastro do Adotante</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>🐾 MatchPet</h1>
      <p>Cadastro do Adotante</p>
    </header>

    <form id="form-adotante" novalidate>
      <fieldset>
        <legend>Dados pessoais</legend>

        <div class="campo">
          <label for="nome_completo">Nome completo *</label>
          <input type="text" id="nome_completo" name="nome_completo" required />
          <span class="erro" data-erro="nome_completo"></span>
        </div>

        <div class="linha">
          <div class="campo">
            <label for="cpf">CPF *</label>
            <input type="text" id="cpf" name="cpf" maxlength="14" placeholder="000.000.000-00" required />
            <span class="erro" data-erro="cpf"></span>
          </div>

          <div class="campo">
            <label for="data_nascimento">Data de nascimento *</label>
            <input type="date" id="data_nascimento" name="data_nascimento" required />
            <span class="erro" data-erro="data_nascimento"></span>
          </div>
        </div>

        <div class="linha">
          <div class="campo">
            <label for="email">E-mail *</label>
            <input type="email" id="email" name="email" required />
            <span class="erro" data-erro="email"></span>
          </div>

          <div class="campo">
            <label for="telefone">Telefone *</label>
            <input type="text" id="telefone" name="telefone" placeholder="(11) 91234-5678" required />
            <span class="erro" data-erro="telefone"></span>
          </div>
        </div>

        <div class="campo">
          <label for="senha">Senha *</label>
          <input type="password" id="senha" name="senha" minlength="8" required />
          <span class="erro" data-erro="senha"></span>
        </div>
      </fieldset>

      <fieldset>
        <legend>Endereço</legend>

        <div class="linha">
          <div class="campo campo-pequeno">
            <label for="cep">CEP *</label>
            <input type="text" id="cep" name="cep" placeholder="00000-000" required />
            <span class="erro" data-erro="cep"></span>
          </div>

          <div class="campo">
            <label for="logradouro">Logradouro *</label>
            <input type="text" id="logradouro" name="logradouro" required />
          </div>

          <div class="campo campo-pequeno">
            <label for="numero">Número *</label>
            <input type="text" id="numero" name="numero" required />
          </div>
        </div>

        <div class="linha">
          <div class="campo">
            <label for="complemento">Complemento</label>
            <input type="text" id="complemento" name="complemento" />
          </div>

          <div class="campo">
            <label for="bairro">Bairro *</label>
            <input type="text" id="bairro" name="bairro" required />
          </div>
        </div>

        <div class="linha">
          <div class="campo">
            <label for="cidade">Cidade *</label>
            <input type="text" id="cidade" name="cidade" required />
          </div>

          <div class="campo campo-pequeno">
            <label for="estado">UF *</label>
            <input type="text" id="estado" name="estado" maxlength="2" placeholder="SP" required />
          </div>
        </div>
      </fieldset>

      <div class="feedback" id="feedback"></div>

      <button type="submit" id="btn-enviar">Criar cadastro</button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
