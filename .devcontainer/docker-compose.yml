# Codespaces: banco PostgreSQL 16 (com schema.sql) + API do Match Pets, que também serve as telas.
services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ../..:/workspaces:cached
    working_dir: /workspaces/match-pets/backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/matchpet
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: matchpet
    volumes:
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - matchpet-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d matchpet"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  matchpet-dados:
